
workflows:
  ios-unsigned:
    name: EasyDraw 7 iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Find Xcode project
        script: |
          PROJECT=$(find . -name "EasyDraw7iOS.xcodeproj" -type d -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: EasyDraw7iOS.xcodeproj not found"
            find . -maxdepth 4 -type f
            exit 1
          fi
          echo "Found project: $PROJECT"
          xcodebuild -list -project "$PROJECT"

      - name: Build iOS app
        script: |
          PROJECT=$(find . -name "EasyDraw7iOS.xcodeproj" -type d -print -quit)
          xcodebuild \
            -project "$PROJECT" \
            -scheme EasyDraw7iOS \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphoneos/*.app
