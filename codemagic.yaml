
workflows:
  ios-unsigned:
    name: EasyDraw 7 iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      xcode: latest

    scripts:
      - name: Check project
        script: |
          xcodebuild -list -project EasyDraw7iOS.xcodeproj

      - name: Build iOS app
        script: |
          xcodebuild \
            -project EasyDraw7iOS.xcodeproj \
            -scheme EasyDraw7iOS \
            -sdk iphoneos \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/Debug-iphoneos/*.app
